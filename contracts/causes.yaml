# BOUSSOLA — Taxonomie fermée des causes de blocage.
# CONTRAT GELÉ. Le moteur ne peut JAMAIS produire un cause_id absent de ce fichier.
# C'est la garantie structurelle contre l'hallucination de cause (critère 25% + 15%).
version: "1.0.0"

owners:
  client:      { label_fr: "Le client",            label_en: "The client" }
  agence:      { label_fr: "L'agence BNA",         label_en: "The BNA branch" }
  back_office: { label_fr: "Le back-office / CSA", label_en: "Back-office / CSA" }
  securite:    { label_fr: "L'équipe sécurité",    label_en: "Security team" }

families:
  F01: { label_fr: "Orientation du parcours",      label_en: "Journey routing" }
  F02: { label_fr: "Identité",                     label_en: "Identity" }
  F03: { label_fr: "Coordonnées et OTP",           label_en: "Contact details & OTP" }
  F04: { label_fr: "Documents",                    label_en: "Documents" }
  F05: { label_fr: "Profil incomplet",             label_en: "Incomplete profile" }
  F06: { label_fr: "Incompatibilité offre/profil", label_en: "Offer/profile mismatch" }
  F07: { label_fr: "Doublon de dossier",           label_en: "Duplicate application" }
  F08: { label_fr: "Attente côté agence",          label_en: "Pending at branch" }
  F09: { label_fr: "Désynchronisation services",   label_en: "Service desync" }
  F10: { label_fr: "Tentative de manipulation",    label_en: "Manipulation attempt" }
  F11: { label_fr: "Choix de l'agence et mode de finalisation", label_en: "Branch choice & completion mode" }

# severity: info | action_client | action_interne | critique
causes:
  # ---- F01 Orientation ---------------------------------------------------
  - id: C-ORI-001
    family: F01
    owner: client
    severity: action_client
    label_fr: "Vous êtes déjà client BNA"
    label_ar: "أنت حريف في البنك الوطني الفلاحي من قبل"
    label_en: "You are already a BNA customer"
  - id: C-ORI-002
    family: F01
    owner: client
    severity: action_client
    label_fr: "Parcours inadapté au statut déclaré"
    label_ar: "المسار غير ملائم للوضعية المصرّح بها"
    label_en: "Journey does not match the declared status"
  - id: C-ORI-003
    family: F01
    owner: client
    severity: action_client
    label_fr: "Dossier expiré, à reprendre depuis le début"
    label_ar: "الملف انتهت صلوحيته، لازم تبدا من جديد"
    label_en: "Application expired, must be restarted"

  # ---- F02 Identité ------------------------------------------------------
  - id: C-IDN-001
    family: F02
    owner: client
    severity: action_client
    label_fr: "Pièce d'identité expirée"
    label_ar: "بطاقة التعريف منتهية الصلوحية"
    label_en: "Expired identity document"
  - id: C-IDN-002
    family: F02
    owner: client
    severity: action_client
